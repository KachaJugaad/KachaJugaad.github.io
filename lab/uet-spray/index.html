<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UET packet spraying</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

body[data-theme="light"]{color-scheme:light}

so-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>800G NIC links, 400G leaf-to-spine links; dim packets are the elephants</span></span><span class="iso-caption">A flow-hashed transfer keeps one entropy value, so every switch's ECMP hash sends all of its packets up one spine: it can never use more than one 400G link, and it shares that link with whatever else hashed there. UET's RUD mode changes the entropy value per packet, so the same ordinary ECMP switches spread the message over every spine, and path-aware load balancing stops using entropy values that come back ECN-marked or trimmed. Packets then arrive out of order, which the OCP NIC spec warns breaks TCP and is why it requires flow-affine RSS; UET makes it harmless because every packet carries its offset and is written straight into place. Rates are the steady-state fair shares NSCC and path-aware spraying aim for, with UET packet headers counted; real convergence takes several round trips and is never perfectly fair.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;
const NIC = 800;
const LINK = 400;
const SPINES = 4;
const MESSAGE = 64 * 2 ** 20;
const EFF = 4096 / (4096 + 38 + 20 + 8 + 12 + 44);
const BASE_US = 4;
const HOME = 1;
const ELEPHANTS = [1, 3, 1, 0, 2, 1];
const MAX_K = ELEPHANTS.length;

function loads(k) {
  const n = Array(SPINES).fill(0);
  for (const s of ELEPHANTS.slice(0, k)) n[s]++;
  return n;
}

function single(n) {
  const rate = LINK / (n[HOME] + 1);
  const x = n.map((_, s) => (s === HOME ? rate : 0));
  const bg = n.map((count, s) => (count ? LINK - x[s] : 0));
  return { rate, x, bg };
}

function spray(n) {
  const frozen = new Set();
  let rate = NIC;
  for (;;) {
    const open = n.map((_, s) => s).filter((s) => !frozen.has(s));
    const crowd = open.reduce((sum, s) => sum + n[s], 0);
    const ours = Math.min(NIC, (LINK * open.length) / (1 + crowd));
    const full = Math.min(...open.filter((s) => n[s]).map((s) => LINK / n[s]), Infinity);
    if (ours <= full) {
      rate = ours;
      break;
    }
    open.filter((s) => n[s] && LINK / n[s] === full).forEach((s) => frozen.add(s));
  }
  const x = Array(SPINES).fill(0);
  const open = n.map((_, s) => s).filter((s) => !frozen.has(s));
  const free = open.filter((s) => !n[s]);
  const busy = open.filter((s) => n[s]);
  const room = LINK * free.length;
  if (rate <= room) free.forEach((s) => (x[s] = rate / free.length));
  else {
    free.forEach((s) => (x[s] = LINK));
    const rest = rate - room;
    const level = (LINK * busy.length - rest) / busy.reduce((sum, s) => sum + n[s], 0);
    busy.forEach((s) => (x[s] = LINK - level * n[s]));
  }
  const bg = n.map((count, s) => (count ? LINK - x[s] : 0));
  return { rate, x, bg };
}

const MODES = {
  single: { label: "One path (flow hash)", short: "One path", order: "in order" },
  spray: { label: "Sprayed (UET RUD)", short: "Sprayed", order: "any order, placed by offset" },
};

function plan(mode, k) {
  const n = loads(k);
  const share = mode === "spray" ? spray(n) : single(n);
  const goodput = share.rate * EFF;
  const us = (MESSAGE * 8) / (goodput * 1e3) + BASE_US;
  return { ...share, n, goodput, us, paths: share.x.filter((v) => v > 0.5).length };
}

function timeLabel(us) {
  if (us < 1000) return `${us.toFixed(0)} µs`;
  const ms = us / 1000;
  return `${ms < 10 ? ms.toFixed(2) : ms.toFixed(1)} ms`;
}

const gbps = (v) => `${Math.round(v)} Gb/s`;

const D = {"P":{"origin":[304.5637377147843,128.2066002584951],"scale":0.7272579754555395,"azimuth":79,"elevation":32},"SLIDE":{"y":85,"spray":-9,"single":-19},"KNOB":[16,85],"KNOB_Z":17.7,"START":{"mode":"spray","k":3},"K":{"done":127.71318118074063,"post":104.13643001672806}};
const P = D.P;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const now = document.querySelector("[data-now]");
const pointer = svg.querySelector('[data-part="pointer"]');
const slider = svg.querySelector('[data-part="slider"]');
const rows = Object.fromEntries([...document.querySelectorAll("[data-row]")].map((row) => [row.dataset.row, row]));
const spineCells = [...document.querySelectorAll("[data-spine]")];
const still = matchMedia("(prefers-reduced-motion: reduce)");
const sr = document.createElement("span");
sr.className = "us-sr";
sr.setAttribute("role", "status");
stage.append(sr);

const slots = [...svg.querySelectorAll("[data-l]")].map((el) => ({ el, l: el.dataset.l, k: +el.dataset.k, s: el.dataset.l[0] === "s" ? +el.dataset.l[1] : -1, state: "" }));
const cells = [...svg.querySelectorAll("[data-cell]")].map((el) => ({ el, side: el.dataset.cell[0], c: +el.dataset.cell.slice(1), on: null }));

const RUN = 4.6;
const HOLD = 1.6;
const V = 56;
const BLOCK = 3;
const PHI = 0.6180339887;
const TOUR = [["single", 3], ["spray", 3], ["single", 6], ["spray", 6], ["single", 0], ["spray", 0]];
let mode = D.START.mode;
let k = D.START.k;
let p = null;
let clock = 0;
let touring = !still.matches;
let step = 1;
let idleTimer = 0;
let sayTimer = 0;
let frame = 0;
let last = 0;
let visible = false;
const knob = { x: k };
const slide = { x: D.SLIDE[mode] };
const travel = D.K.done / V;
const spineName = (s) => s + 1;
const list = (items) => items.map(spineName).join(", ");

function pointerAt(index) {
  const angle = -0.75 * Math.PI + (index / MAX_K) * 1.5 * Math.PI;
  const [x, y] = D.KNOB;
  return lineOnTop([x + Math.sin(angle) * 1.6, y - Math.cos(angle) * 1.6], [x + Math.sin(angle) * 5.4, y - Math.cos(angle) * 5.4], D.KNOB_Z, P);
}

function describe() {
  const elephants = (count) => `${count} elephant${count === 1 ? "" : "s"}`;
  if (mode === "single") {
    const count = p.n[HOME];
    if (!count) return `hashed to spine ${spineName(HOME)} · alone there, but one flow can never use more than one 400G link`;
    return `hashed to spine ${spineName(HOME)} · shared with ${elephants(count)} · ${gbps(p.rate)} for each flow`;
  }
  const used = p.x.map((v, s) => (v > 0.5 ? s : -1)).filter((s) => s >= 0);
  const skipped = p.x.map((v, s) => (v > 0.5 ? -1 : s)).filter((s) => s >= 0);
  const head = `sprayed over spine${used.length > 1 ? "s" : ""} ${list(used)}`;
  const tail = skipped.length ? ` · skipped ${list(skipped)}, full of elephants` : "";
  const shared = used.some((s) => p.n[s]) ? ` · ${gbps(p.x[used.find((s) => p.n[s])])} a spine beside the elephants` : "";
  return head + shared + tail;
}

function replan() {
  p = plan(mode, k);
  const slow = plan("single", k).us;
  p.scale = RUN / slow;
  p.send = p.us * p.scale;
  p.slots = p.send * V;
  p.a = p.rate / NIC;
  let cum = 0;
  p.band = p.x.map((x) => {
    const w = (p.a * x) / p.rate;
    const band = [cum, cum + w];
    cum += w;
    return band;
  });
  p.end = p.send + travel;
  clock = 0;
  for (const [key, row] of Object.entries(rows)) {
    const q = plan(key, k);
    row.querySelector('[data-col="time"]').textContent = timeLabel(q.us);
    row.querySelector('[data-col="rate"]').textContent = gbps(q.goodput);
    row.querySelector('[data-col="paths"]').textContent = q.paths;
    row.toggleAttribute("data-on", key === mode);
  }
  spineCells.forEach((cell, s) => {
    cell.textContent = `${Math.round(p.x[s])} · ${p.n[s] ? `${p.n[s]}×${Math.round(p.bg[s] / p.n[s])}` : "–"}`;
    cell.toggleAttribute("data-hot", p.x[s] > 0.5);
  });
  const text = describe();
  if (now.textContent !== text) now.textContent = text;
}

function stateOf(slot, t) {
  const j = Math.floor(t * V - slot.k);
  const u = (Math.floor(j / BLOCK) * PHI + 0.137) % 1;
  const u1 = u < 0 ? u + 1 : u;
  const sending = j >= 0 && j < p.slots;
  if (slot.s < 0) return sending && u1 < p.a ? "hot" : "";
  const [lo, hi] = p.band[slot.s];
  if (sending && u1 >= lo && u1 < hi) return "hot";
  if (p.bg[slot.s] > 0 && (u1 - hi + 1) % 1 < p.bg[slot.s] / NIC) return "bg";
  return "";
}

function paint() {
  const t = still.matches ? travel * 0.55 : clock;
  for (const slot of slots) {
    const next = stateOf(slot, t);
    if (next === slot.state) continue;
    slot.el.toggleAttribute("data-hot", next === "hot");
    slot.el.toggleAttribute("data-bg", next === "bg");
    slot.state = next;
  }
  for (const cell of cells) {
    const due = ((cell.c + 1) / 16) * p.send;
    const on = cell.side === "A" ? t < due : t >= due + travel;
    if (on === cell.on) continue;
    cell.el.toggleAttribute("data-hot", on);
    cell.on = on;
  }
  const head = `${MODES[mode].short} · ${k} elephant${k === 1 ? "" : "s"} · `;
  const t0 = still.matches || clock >= p.send ? p.us : clock / p.scale;
  const text = `${head}${timeLabel(t0)}`;
  if (readout.textContent !== text) readout.textContent = text;
  pointer.setAttribute("d", pointerAt(knob.x));
  slider.setAttribute("transform", translateAlong(P, [slide.x, 0, 0]));
}

function tick(ts) {
  const dt = last ? Math.min((ts - last) / 1000, 1 / 30) : 1 / 60;
  last = ts;
  const calm = still.matches;
  const ease = calm ? 1 : 1 - Math.exp(-dt / 0.18);
  knob.x += (k - knob.x) * ease;
  if (Math.abs(k - knob.x) < 0.002) knob.x = k;
  const target = D.SLIDE[mode];
  slide.x += (target - slide.x) * ease;
  if (Math.abs(target - slide.x) < 0.01) slide.x = target;
  if (!calm) {
    clock += dt;
    if (clock > p.end + HOLD) {
      if (touring) {
        [mode, k] = TOUR[step];
        step = (step + 1) % TOUR.length;
      }
      replan();
    }
  }
  paint();
  const settled = calm && knob.x === k && slide.x === target;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

function choose(nextMode, nextK) {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    touring = !still.matches;
  }, 6000);
  if (nextMode === mode && nextK === k) return;
  mode = nextMode;
  k = nextK;
  replan();
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => {
    sr.textContent = `${MODES[mode].label}, ${k} elephant flows: 64 mebibytes in ${timeLabel(p.us)}, ${gbps(p.goodput)} over ${p.paths} spine${p.paths === 1 ? "" : "s"}. ${describe()}.`;
  }, 700);
  run();
}

const flip = () => (mode === "spray" ? "single" : "spray");
stage.addEventListener("pointermove", (event) => {
  if (event.pointerType !== "mouse") return;
  const box = svg.getBoundingClientRect();
  const share = Math.min(1, Math.max(0, ((event.clientX - box.left) / box.width - 0.12) / 0.76));
  choose(mode, Math.round(share * MAX_K));
});
stage.addEventListener("click", () => choose(flip(), k));
stage.addEventListener("keydown", (event) => {
  let next = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") next = [mode, Math.min(MAX_K, k + 1)];
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = [mode, Math.max(0, k - 1)];
  if (event.key === "Home") next = [mode, 0];
  if (event.key === "End") next = [mode, MAX_K];
  if (event.key === " " || event.key === "Enter") next = [flip(), k];
  if (!next) return;
  event.preventDefault();
  choose(...next);
});
still.addEventListener("change", () => {
  touring = !still.matches;
  replan();
  run();
});
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

replan();
paint();
</script></body></html>
